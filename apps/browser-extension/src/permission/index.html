<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sahaay Voice Access</title>
  <style>
    :root {
      --bg: #070c14;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(85, 216, 255, 0.2);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --mint: #8af5cf;
      --cyan: #55d8ff;
      --success: #65e6af;
      --danger: #ff8d91;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image: radial-gradient(circle at 50% 20%, rgba(85, 216, 255, 0.12) 0%, transparent 60%);
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .icon-container {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(138, 245, 207, 0.15), rgba(85, 216, 255, 0.25));
      border: 1px solid rgba(138, 245, 207, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(85, 216, 255, 0.2);
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 12px;
    }
    p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--mint), var(--cyan));
      color: #070c14;
      border: none;
      font-size: 15px;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(85, 216, 255, 0.3);
      width: 100%;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(85, 216, 255, 0.45);
    }
    .status-msg {
      margin-top: 20px;
      font-size: 13px;
      min-height: 20px;
      font-weight: 500;
    }
    .status-success { color: var(--success); }
    .status-error { color: var(--danger); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#8af5cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="22"></line>
      </svg>
    </div>
    <h1>Enable Sahaay Voice Input</h1>
    <p>
      Chrome requires microphone permission to be granted in an open tab before the Sahaay Sidepanel can listen to your voice. Click below to allow microphone access.
    </p>
    <button id="btn-request" class="btn">
      Allow Microphone Access
    </button>
    <div id="status-msg" class="status-msg"></div>
  </div>

  <script src="../../dist/permission/permission.js"></script>
</body>
</html>
