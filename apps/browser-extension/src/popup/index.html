<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sahaay Status</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      width: 320px;
      background: #090d16;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 8px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      background: #059669;
      color: white;
    }
    .badge-warn {
      background: #d97706;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
    }
    .btn-secondary:hover {
      background: #334155;
    }
    .details {
      margin-top: 10px;
      padding: 10px;
      background: #0f172a;
      border-radius: 6px;
      border: 1px solid #1e293b;
      font-size: 11px;
      color: #94a3b8;
      max-height: 160px;
      overflow-y: auto;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="header">
    <strong style="font-size: 14px; color: #38bdf8;">Sahaay Browser Bridge</strong>
    <span class="badge" id="host-badge">Ready</span>
  </div>

  <p style="font-size: 12px; color: #94a3b8; margin: 4px 0 10px;">
    Authorized tab observation & bounded execution gateway.
  </p>

  <button class="btn" id="btn-inspect">Inspect Current Tab</button>
  <button class="btn btn-secondary" id="btn-scroll">Execute Test Scroll (+300px)</button>

  <div class="details" id="result-box">
    Click 'Inspect Current Tab' to capture permitted title, URL, dimensions, and sanitized text excerpt.
  </div>

  <script type="module" src="../../dist/popup/popup.js"></script>
</body>
</html>
